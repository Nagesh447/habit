<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atomic Ascent</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#6C4DFF">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ascent">
<style>
/* Layout idea: one narrow column like a phone app; a dawn-sky "rank" header is the single bold element, everything below stays quiet. */
:root {
  /* Bright, clean: white cards on a faint lavender page; habit colors live in the circle. */
  --bg: #F5F4FF;
  --surface: #ffffff;
  --ink: #1B1A33;
  --muted: #6E6B8F;
  --line: #E6E3F7;
  --ember: #6C4DFF;
  --ember-soft: #EEEAFF;
  --indigo: #3A86FF;
  --indigo-soft: #E5F0FF;
  --good: #06A77D;
  --good-soft: #DDF8EF;
  --warn: #C2410C;
  --warn-soft: #FFEDD5;
  --gold: #F5A300;
  --font-display: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
  --font-body: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12111F; --surface: #1D1B30; --ink: #F1F0FF; --muted: #A9A6C9; --line: #302D4C;
    --ember: #9D86FF; --ember-soft: #2A2350; --indigo: #6FA8FF; --indigo-soft: #1D2A48;
    --good: #2EE6A8; --good-soft: #0E3A2D; --warn: #FDBA74; --warn-soft: #3A2210; --gold: #FFC94D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12111F; --surface: #1D1B30; --ink: #F1F0FF; --muted: #A9A6C9; --line: #302D4C;
  --ember: #9D86FF; --ember-soft: #2A2350; --indigo: #6FA8FF; --indigo-soft: #1D2A48;
  --good: #2EE6A8; --good-soft: #0E3A2D; --warn: #FDBA74; --warn-soft: #3A2210; --gold: #FFC94D;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5;
  padding: env(safe-area-inset-top) 0 calc(84px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color: transparent; }
main { max-width: 600px; margin: 0 auto; padding: 0 16px; display: flex; flex-direction: column; gap: 14px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
h2 { font-size: 18px; font-weight: 700; }
h3 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.hidden { display: none !important; }
body.signed-out nav { display: none; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--indigo); outline-offset: 2px; border-radius: 6px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 8px; }
.section-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-top: 6px; }

/* Hero */
.hero { position: relative; overflow: hidden; border-radius: 22px; padding: 18px 18px 16px; margin-top: 14px;
  background: linear-gradient(160deg, var(--hero-a) 0%, var(--hero-b) 48%, var(--hero-c) 100%); border: 1px solid var(--line); }
.hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.hero > *:not(canvas) { position: relative; }
.hero-top { display: flex; gap: 14px; align-items: center; }
.emblem { flex: none; width: 66px; height: 66px; border-radius: 18px; background: var(--ink); color: var(--bg);
  display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; }
.emblem small { font-size: 10px; letter-spacing: .14em; font-weight: 700; opacity: .75; }
.emblem b { font-family: var(--font-display); font-size: 28px; font-weight: 800; margin-top: 3px; }
.rank { font-family: var(--font-display); font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.hero-date { font-size: 13px; color: var(--muted); }
.xpbar { height: 12px; border-radius: 99px; background: color-mix(in srgb, var(--surface) 70%, transparent); overflow: hidden; margin-top: 14px; border: 1px solid var(--line); }
.xpbar > div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--indigo), var(--ember)); transition: width .7s cubic-bezier(.2,.8,.2,1); }
.hero-stats { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); margin-top: 6px; gap: 8px; flex-wrap: wrap; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 99px; font-size: 13px; font-weight: 600;
  background: var(--surface); border: 1px solid var(--line); }
.chip svg { width: 15px; height: 15px; }
.sync { font-size: 12px; }
.sync.ok { color: var(--good); } .sync.err { color: var(--warn); }

/* Day ring */
.day { display: flex; gap: 16px; align-items: center; }
.ring { flex: none; width: 76px; height: 76px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.btn { border: none; border-radius: 12px; padding: 11px 16px; font-weight: 700; background: var(--ink); color: var(--bg); }
.btn.ember { background: var(--ember); color: #fff; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.soft { background: var(--indigo-soft); color: var(--indigo); }
.btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.full { width: 100%; }
.chest-btn { animation: wobble 1.6s ease-in-out infinite; }
@keyframes wobble { 0%,100% { transform: rotate(0) } 10% { transform: rotate(-4deg) } 20% { transform: rotate(4deg) } 30% { transform: rotate(0) } }

/* Quests */
.quest { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.qbox { flex: none; width: 22px; height: 22px; border-radius: 7px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; }
.quest.done .qbox { background: var(--good); border-color: var(--good); color: #fff; }
.quest.done .qtext { color: var(--muted); text-decoration: line-through; }
.qxp { margin-left: auto; font-size: 13px; font-weight: 700; color: var(--indigo); white-space: nowrap; }

/* Alerts */
.alert { border-radius: 16px; padding: 14px 16px; background: var(--warn-soft); color: var(--warn); display: flex; flex-direction: column; gap: 10px; border: 1px solid transparent; }
.alert b { color: inherit; }
.alert .btns { display: flex; gap: 8px; flex-wrap: wrap; }

/* Habit card */
.habit { display: flex; gap: 14px; align-items: flex-start; }
.check { flex: none; width: 56px; height: 56px; border-radius: 50%; border: 2.5px solid var(--ember); background: var(--surface); color: var(--ember);
  display: flex; align-items: center; justify-content: center; transition: transform .15s; }
.check svg { width: 26px; height: 26px; }
.check.done { background: var(--ember); color: #fff; }
.check.mini { background: var(--ember-soft); }
.habit.break .check { border-color: var(--indigo); color: var(--indigo); }
.habit.break .check.done { background: var(--indigo); color: #fff; }
.check:active { transform: scale(.92); }
.check.pop { animation: pop .4s ease-out; }
@keyframes pop { 40% { transform: scale(1.22) } }
.hname { font-weight: 700; font-size: 17px; line-height: 1.3; }
.hmeta { font-size: 13px; color: var(--muted); line-height: 1.45; }
.chain { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
.dot { width: 14px; height: 14px; border-radius: 4px; background: var(--line); }
.dot.on { background: var(--ember); } .dot.mini { background: color-mix(in srgb, var(--ember) 45%, var(--line)); }
.dot.shield { background: var(--indigo-soft); outline: 1.5px solid var(--indigo); outline-offset: -1.5px; }
.habit.break .dot.on { background: var(--indigo); }
.dot.today { outline: 2px solid var(--ink); outline-offset: 1px; }
.hfoot { display: flex; align-items: center; gap: 10px; margin-top: 8px; flex-wrap: wrap; }
.flame { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 14px; color: var(--ember); }
.flame svg { width: 16px; height: 16px; }
.linkbtn { background: none; border: none; padding: 4px 0; color: var(--indigo); font-weight: 600; font-size: 14px; }
.tag { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 3px 8px; border-radius: 99px; background: var(--indigo-soft); color: var(--indigo); }
.tag.ember { background: var(--ember-soft); color: var(--ember); }
.tag.good { background: var(--good-soft); color: var(--good); }

/* Forms */
label { font-size: 13px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
input[type=text], input[type=time], textarea, select { width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 16px; }
textarea { resize: vertical; min-height: 70px; }
.law { border-left: 3px solid var(--ember); padding-left: 12px; display: flex; flex-direction: column; gap: 10px; }
.law.l2 { border-color: var(--indigo); } .law.l3 { border-color: var(--good); } .law.l4 { border-color: var(--gold); }
.law-h { font-family: var(--font-display); font-size: 13px; font-weight: 700; letter-spacing: .02em; }
.err { color: #c0362c; font-size: 13px; }
.seg { display: flex; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
.seg button { flex: 1; border: none; background: none; padding: 9px; border-radius: 9px; font-weight: 700; color: var(--muted); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } }

/* Learn */
details.lesson { border-top: 1px solid var(--line); padding: 12px 0; }
details.lesson:first-of-type { border-top: none; }
details.lesson summary { list-style: none; display: flex; align-items: center; gap: 10px; cursor: pointer; font-weight: 700; }
details.lesson summary::-webkit-details-marker { display: none; }
.lnum { flex: none; width: 28px; height: 28px; border-radius: 8px; background: var(--indigo-soft); color: var(--indigo); font-size: 12px; font-weight: 800;
  display: flex; align-items: center; justify-content: center; font-family: var(--font-display); }
.learned .lnum { background: var(--good); color: #fff; }
.lbody { padding: 10px 0 2px 38px; display: flex; flex-direction: column; gap: 10px; max-width: 65ch; }
.doit { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.progress { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.progress > div { height: 100%; background: var(--good); border-radius: 99px; }

/* Scorecard */
.sc-item { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); }
.sc-item:first-child { border-top: none; }
.sc-item span { flex: 1; }
.rate { display: flex; gap: 4px; }
.rate button { width: 34px; height: 30px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 800; }
.rate button.on.p { background: var(--good); color: #fff; border-color: var(--good); }
.rate button.on.m { background: #c0362c; color: #fff; border-color: #c0362c; }
.rate button.on.z { background: var(--muted); color: var(--surface); border-color: var(--muted); }
.x { background: none; border: none; color: var(--muted); font-size: 18px; padding: 2px 6px; }

/* You */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.stat { background: var(--bg); border-radius: 12px; padding: 10px; }
.stat b { display: block; font-family: var(--font-display); font-size: 20px; }
.stat span { font-size: 12px; color: var(--muted); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 8px; }
.badge { border-radius: 12px; padding: 10px 8px; text-align: center; background: var(--bg); border: 1px solid var(--line); font-size: 12px; line-height: 1.3; }
.badge svg { width: 28px; height: 28px; display: block; margin: 0 auto 6px; }
.badge.locked { opacity: .45; filter: grayscale(1); }
.badge b { display: block; font-size: 12.5px; }
.idbar { display: flex; flex-direction: column; gap: 4px; }
.idbar .progress > div { background: linear-gradient(90deg, var(--indigo), var(--ember)); }
#chart { width: 100%; height: 200px; display: block; }
.coach-out { white-space: pre-wrap; font-size: 15px; background: var(--bg); border-radius: 12px; padding: 12px; }

/* Nav */
nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--surface); border-top: 1px solid var(--line); display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom); z-index: 30; }
nav .inner { display: flex; width: 100%; max-width: 600px; }
nav a { flex: 1; text-align: center; padding: 10px 4px 12px; text-decoration: none; color: var(--muted); font-size: 12px; font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 3px; }
nav a svg { width: 22px; height: 22px; }
nav a.on { color: var(--ember); }

/* Floating XP, toasts */
.plus { position: fixed; z-index: 60; pointer-events: none; font-family: var(--font-display); font-weight: 800; font-size: 16px; color: var(--ember); animation: floatUp 1s ease-out forwards; }
@keyframes floatUp { from { transform: translateY(0); opacity: 1 } to { transform: translateY(-60px); opacity: 0 } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(92px + env(safe-area-inset-bottom)); z-index: 70; max-width: 92vw;
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 16px; font-size: 14px; display: flex; gap: 10px; align-items: center; animation: toastIn .3s ease-out; }
.toast svg { width: 26px; height: 26px; flex: none; }
@keyframes toastIn { from { transform: translate(-50%, 20px); opacity: 0 } }

/* Modal */
.modal { position: fixed; inset: 0; z-index: 80; background: rgba(18,16,42,.45); display: flex; align-items: flex-end; justify-content: center; padding: 16px; }
.modal .sheet { background: var(--surface); border-radius: 20px; padding: 20px; width: 100%; max-width: 480px; display: flex; flex-direction: column; gap: 12px; margin-bottom: env(safe-area-inset-bottom); }
@media (min-height: 600px) { .modal { align-items: center; } }

/* Chest */
.chest-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 8px 0; text-align: center; }
.chest { width: 120px; height: 100px; }
.chest.shake { animation: shake .5s ease-in-out 3; }
@keyframes shake { 25% { transform: rotate(-6deg) } 75% { transform: rotate(6deg) } }
.chest .lid { transform-origin: 20px 40px; transition: transform .5s cubic-bezier(.3,1.6,.5,1); }
.chest.open .lid { transform: rotate(-28deg) translateY(-6px); }
.loot { font-family: var(--font-display); font-weight: 800; font-size: 34px; }
.rar-common { color: var(--good); } .rar-rare { color: var(--indigo); } .rar-epic { color: var(--ember); } .rar-legendary { color: var(--gold); }

/* Confetti */
.confetti { position: fixed; top: 40%; left: 50%; width: 9px; height: 9px; border-radius: 2px; z-index: 75; pointer-events: none; animation: burst 1.3s ease-out forwards; }
@keyframes burst { from { transform: translate(-50%,-50%) rotate(0); opacity: 1 } to { transform: translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--r)); opacity: 0 } }

/* Level-up scene (light dawn + phoenix) */
#levelup { position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity .35s; overflow: hidden;
  background: linear-gradient(180deg,#fdf1e4 0%,#fbe3ea 38%,#e9e6fb 70%,#e2f1fb 100%); }
#levelup.show { opacity: 1; pointer-events: auto; }
.lu-sun { position: absolute; left: 50%; top: 42%; width: 520px; height: 520px; transform: translate(-50%,-50%); border-radius: 50%;
  background: radial-gradient(circle, rgba(255,236,190,.95) 0%, rgba(255,214,170,.55) 30%, rgba(255,214,170,0) 68%); }
.lu-rays { position: absolute; left: 50%; top: 42%; width: 1100px; height: 1100px; margin: -550px 0 0 -550px; border-radius: 50%;
  background: repeating-conic-gradient(rgba(255,255,255,.55) 0 6deg, rgba(255,255,255,0) 6deg 18deg); animation: spin 30s linear infinite;
  -webkit-mask: radial-gradient(circle, #000 0%, transparent 60%); mask: radial-gradient(circle, #000 0%, transparent 60%); }
@keyframes spin { to { transform: rotate(360deg) } }
.lu-hills { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 34%; }
.lu-bird { position: absolute; left: 50%; top: 14%; width: 240px; margin-left: -120px; opacity: 0; }
#levelup.show .lu-bird { animation: rise 1.6s cubic-bezier(.2,.8,.2,1) forwards, hover 3s ease-in-out 1.6s infinite; }
@keyframes rise { from { transform: translateY(120px) scale(.6); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes hover { 0%,100% { transform: none; opacity: 1 } 50% { transform: translateY(-8px); opacity: 1 } }
.lu-bird .wing { transform-box: fill-box; animation: flap 1.1s ease-in-out infinite; }
.lu-bird .wl { transform-origin: 100% 100%; } .lu-bird .wr { transform-origin: 0% 100%; }
@keyframes flap { 50% { transform: scaleY(.55) } }
.mote { position: absolute; bottom: -20px; border-radius: 50%; background: radial-gradient(circle,#fff 0%,rgba(255,224,170,.9) 45%,rgba(255,224,170,0) 70%); opacity: 0; }
#levelup.show .mote { animation: drift var(--d) linear var(--delay) infinite; }
@keyframes drift { 0% { transform: translate(0,0); opacity: 0 } 15% { opacity: 1 } 100% { transform: translate(var(--sx),-105vh); opacity: 0 } }
.lu-box { position: relative; text-align: center; transform: scale(.5); opacity: 0; margin-top: 90px; padding: 0 24px; }
#levelup.show .lu-box { animation: boxIn .8s cubic-bezier(.2,1.5,.4,1) .25s forwards; }
@keyframes boxIn { to { transform: scale(1); opacity: 1 } }
.lu-label { font-family: var(--font-display); font-size: 13px; letter-spacing: .4em; color: #854f0b; font-weight: 700; }
.lu-num { font-family: var(--font-display); font-size: 108px; font-weight: 800; line-height: 1; margin: 6px 0;
  background: linear-gradient(135deg,#534ab7 0%,#d4537e 55%,#ef9f27 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.lu-title { font-family: var(--font-display); font-size: 22px; font-weight: 800; color: #3c3489; }
.lu-sub { font-size: 15px; color: #5f5e5a; margin: 8px auto 0; max-width: 290px; line-height: 1.45; }
.lu-tap { font-size: 12px; color: #888780; margin-top: 22px; }
.spark { position: absolute; left: 50%; top: 52%; width: 8px; height: 8px; border-radius: 2px; opacity: 0; }
#levelup.show .spark { animation: burst 1.4s ease-out .3s forwards; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  #levelup.show .lu-box, #levelup.show .lu-bird { opacity: 1; transform: none; }
}

/* Bright overrides */
h1, h2, h3 { letter-spacing: 0; font-weight: 700; }
h2 { font-size: 18px; }
.hero { background: none; border: none; border-radius: 0; padding: 18px 2px 2px; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.lvl { font-weight: 800; font-size: 17px; }
.lvpill { font-weight: 800; font-size: 12px; letter-spacing: .06em; color: #fff; padding: 4px 9px; border-radius: 99px; background: linear-gradient(135deg, #8338EC, #FF5DA2); }
.xpbar { margin-top: 2px; height: 10px; background: var(--line); border: none; }
.xpbar > div { background: linear-gradient(90deg, #8338EC, #FF5DA2 60%, #FF9F1C); }
.hstat svg { width: 15px; height: 15px; }
.card { border-radius: 18px; padding: 14px; gap: 8px; border: none; box-shadow: 0 1px 2px rgba(27,26,51,.05), 0 4px 16px rgba(108,77,255,.06); }
.ringcard { align-items: center; text-align: center; padding: 18px 14px 16px; }
.ringwrap { position: relative; width: 220px; height: 220px; }
.ringmid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ringmid b { font-size: 46px; font-weight: 800; line-height: 1; letter-spacing: -.02em; }
.ringmid span { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .12em; margin-top: 4px; }
.ringline { font-size: 15px; color: var(--muted); }
.ringline b { color: var(--ink); }
.seg { transition: opacity .5s ease; }
.ringcard.closed .ringsvg { animation: glow 2.4s ease-in-out infinite; }
@keyframes glow { 50% { filter: drop-shadow(0 0 12px rgba(131,56,236,.45)); transform: rotate(-90deg) scale(1.03); } }
.minring { flex: none; width: 46px; height: 46px; }
.list { padding: 6px 14px; gap: 0; }
.hrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.hrow:first-child { border-top: none; }
.check { width: 44px; height: 44px; border: 2.5px solid var(--c, var(--ember)); color: var(--c, var(--ember)); background: var(--surface); }
.check svg { width: 22px; height: 22px; }
.check.done { background: var(--c, var(--ember)); color: #fff; border-color: var(--c, var(--ember)); }
.check.mini { background: color-mix(in srgb, var(--c, var(--ember)) 22%, var(--surface)); }
.habit.break .check, .hrow .check { border-color: var(--c); }
.hname { font-size: 16px; font-weight: 700; }
.hrow.on .hname { color: var(--muted); }
.flame { color: #FF7A00; font-size: 14px; flex: none; }
.flame svg { width: 15px; height: 15px; }
.linkbtn { font-size: 13px; color: var(--c, var(--ember)); text-align: left; margin-top: 2px; font-weight: 700; }
.alert { padding: 12px 14px; gap: 8px; font-size: 15px; border-radius: 16px; }
details.quests summary, details.more summary { list-style: none; cursor: pointer; }
details.quests summary::-webkit-details-marker, details.more summary::-webkit-details-marker { display: none; }
details.quests[open] summary { margin-bottom: 6px; }
details.more summary { color: var(--ember); font-weight: 700; font-size: 14px; }
.qxp { color: var(--ember); font-weight: 700; }
.chest-btn { animation: wobble 1.6s ease-in-out infinite; background: linear-gradient(135deg, #FF5DA2, #FF9F1C); }
.btn.ember { background: var(--ember); }
.btn.soft { background: var(--ember-soft); color: var(--ember); }
nav { border-top: none; box-shadow: 0 -4px 20px rgba(27,26,51,.06); }
nav a.on { color: var(--ember); }
.emblem, .rank, .chips { display: none; }

/* One-color rings; everything turns green when all are closed */
:root { --ring: #6C4DFF; --done: #06C270; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --ring: #9D86FF; --done: #2EE6A8; } }
:root[data-theme="dark"] { --ring: #9D86FF; --done: #2EE6A8; }
.ringmid b { font-size: 32px; }
.arc { animation: draw .8s cubic-bezier(.3,.8,.3,1); }
@keyframes draw { from { stroke-dasharray: 0 9999; } }
.check { --c: var(--ring); }
.ringcard.closed .ringsvg { animation: glowG 2.4s ease-in-out infinite; }
@keyframes glowG { 50% { filter: drop-shadow(0 0 14px rgba(6,194,112,.5)); transform: rotate(-90deg) scale(1.03); } }
body.all-done { --ember: var(--done); --ring: var(--done); }
body.all-done .check { --c: var(--done); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) body.all-done { --ember-soft: #0E3A2D; } }
:root[data-theme="dark"] body.all-done { --ember-soft: #0E3A2D; }
body.all-done .xpbar > div, body.all-done .lvpill, body.all-done .chest-btn { background: var(--done); }
body.all-done .ringline b { color: var(--done); }
body, .card, .check, .xpbar > div, .lvpill, nav a { transition: background-color .6s, color .6s, border-color .6s; }

/* Day color drives the accent; big overall streak */
:root { --ember-soft: color-mix(in srgb, var(--ring) 14%, var(--surface)); }
body.all-done { --ember-soft: color-mix(in srgb, var(--done) 14%, var(--surface)); }
.xpbar > div, .lvpill { background: var(--ring) !important; }
.chest-btn { background: var(--ring); }
.streakbig { display: flex; align-items: center; gap: 6px; color: #FF7A00; }
.streakbig svg { width: 30px; height: 30px; }
.streakbig b { font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -.02em; color: var(--ink); }
.streakbig span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); line-height: 1.15; }
.ringmid b { font-size: 44px; }
.ringwrap { width: 220px; height: 220px; }

.lessoncard summary { list-style: none; cursor: pointer; }
.lessoncard summary::-webkit-details-marker { display: none; }
.lessoncard p { max-width: 65ch; }
</style>
</head>
